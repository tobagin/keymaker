app-id: io.github.tobagin.keysmith
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: keymaker
separate-locales: false
finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=~/.ssh
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.gnome.keyring
cleanup:
  - /include
  - /lib/pkgconfig
  - /man
  - /share/doc
  - /share/gtk-doc
  - /share/man
  - /share/pkgconfig
  - '*.la'
  - '*.a'

modules:
  - name: openssh-client
    buildsystem: autotools
    config-opts:
      - --prefix=/app
      - --sysconfdir=/app/etc
      - --without-ssh1
      - --with-privsep-path=/app/var/lib/sshd
      - --with-privsep-user=nobody
      - --with-sandbox=no
      - --disable-strip
    build-commands:
      - make
      - make install-nokeys
      - install -m 755 contrib/ssh-copy-id /app/bin/ssh-copy-id
    sources:
      - type: archive
        url: https://cdn.openbsd.org/pub/OpenBSD/OpenSSH/portable/openssh-10.3p1.tar.gz
        sha256: 56682a36bb92dcf4b4f016fd8ec8e74059b79a8de25c15d670d731e7d18e45f4
    cleanup:
      - /share/man
      - /include
      - /lib/pkgconfig
      - /bin/sshd*
      - /libexec/sftp-server
      - /libexec/ssh-keysign
      - /libexec/ssh-pkcs11-helper
      - /sbin

  - name: qrencode
    buildsystem: cmake
    config-opts:
      - -DCMAKE_INSTALL_PREFIX=/app
      - -DBUILD_SHARED_LIBS=ON
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    sources:
      - type: git
        url: https://github.com/fukuchi/libqrencode.git
        tag: v4.1.1
        commit: 715e29fd4cd71b6e452ae0f4e36d917b43122ce8
    cleanup:
      - /include
      - /lib/pkgconfig
      - /share/man
      - '*.la'
      - '*.a'

  - name: zbar
    buildsystem: simple
    build-commands:
      - autoreconf -fiv
      - ./configure --prefix=/app --without-x --without-qt --without-gtk --without-python --disable-doc --without-dbus
      - make
      - make install
    sources:
      - type: git
        url: https://github.com/mchehab/zbar.git
        tag: 0.23.93
        commit: bb05ec54eec57f8397cb13fb9161372a281a1219
    cleanup:
      - /include
      - /lib/pkgconfig
      - /share/man
      - '*.la'
      - '*.a'

  - name: libsecret
    buildsystem: meson
    config-opts:
      - -Dbash_completion=disabled
      - -Dmanpage=false
      - -Dintrospection=true
    sources:
      - type: git
        url: https://gitlab.gnome.org/GNOME/libsecret.git
        tag: 0.21.7
        commit: 0936f740c02b60f02657729cd99f581db4517a41
    cleanup:
      - /include
      - /lib/pkgconfig
      - /share/doc
      - /share/man
      - '*.la'
      - '*.a' 

  - name: libsoup
    buildsystem: meson
    config-opts:
      - -Dintrospection=enabled
      - -Dvapi=enabled
      - -Ddocs=disabled
      - -Dtests=false
      - -Dsysprof=disabled
    sources:
      - type: git
        url: https://gitlab.gnome.org/GNOME/libsoup.git
        tag: 3.6.6
        commit: 25eac153004f777581ca2d95e31a02ca96844332
    cleanup:
      - /include
      - /lib/pkgconfig
      - /share/doc
      - /share/man
      - '*.la'
      - '*.a' 
      
  - name: simdutf
    buildsystem: cmake
    config-opts:
      - -DCMAKE_INSTALL_PREFIX=/app
      - -DBUILD_SHARED_LIBS=ON
    sources:
      - type: git
        url: https://github.com/simdutf/simdutf.git
        tag: v9.0.0
        commit: ca7acbcea967b5dcbab490066e99e3a6e6925539
    cleanup:
      - /include
      - /lib/pkgconfig
      - /lib/cmake

  - name: fast_float
    buildsystem: cmake
    config-opts:
      - -DCMAKE_INSTALL_PREFIX=/app
      - -DBUILD_SHARED_LIBS=ON
    sources:
      - type: git
        url: https://github.com/fastfloat/fast_float.git
        tag: v8.2.6
        commit: cfd12ebcf1f82c4fd44a950b1815dd0549bc8d89
    cleanup:
      - /include
      - /lib/cmake

  - name: vte
    buildsystem: meson
    config-opts:
      - -Ddocs=false
      - -Dvapi=true
      - -Dgtk4=true
      - -Dgtk3=false
      - -D_systemd=false
    sources:
      - type: git
        url: https://gitlab.gnome.org/GNOME/vte.git
        tag: 0.84.0
        commit: 5da1ed34b210f2b000ef954c147f9a1391da363b
    cleanup:
      - /etc
      - /include
      - /lib/pkgconfig
      - /share/gtk-doc
      - /share/vala
      - '*.la'
      - '*.a'

  - name: keymaker
    buildsystem: meson
    sources:
      - type: git
        url: https://github.com/tobagin/keymaker.git
        tag: v1.5.0
        commit: 3f08a4a4ba79904038f574b71ffbded4e0c56c8a