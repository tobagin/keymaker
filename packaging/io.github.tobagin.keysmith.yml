app-id: io.github.tobagin.keysmith
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: keymaker
separate-locales: false
finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=~/.ssh
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.gnome.keyring
cleanup:
  - /include
  - /lib/pkgconfig
  - /man
  - /share/doc
  - /share/gtk-doc
  - /share/man
  - /share/pkgconfig
  - '*.la'
  - '*.a'

modules:
  - name: openssh-client
    buildsystem: autotools
    config-opts:
      - --prefix=/app
      - --sysconfdir=/app/etc
      - --without-ssh1
      - --with-privsep-path=/app/var/lib/sshd
      - --with-privsep-user=nobody
      - --with-sandbox=no
      - --disable-strip
    build-commands:
      - make
      - make install-nokeys
      - install -m 755 contrib/ssh-copy-id /app/bin/ssh-copy-id
    sources:
      - type: archive
        url: https://cdn.openbsd.org/pub/OpenBSD/OpenSSH/portable/openssh-10.6p2.tar.gz
        sha256: 9ae44872090cf2f06b3cf9ff147e7f16f309671340763ed2f99248398ae29d5b
    cleanup:
      - /share/man
      - /include
      - /lib/pkgconfig
      - /bin/sshd*
      - /libexec/sftp-server
      - /libexec/ssh-keysign
      - /libexec/ssh-pkcs11-helper
      - /sbin

  - name: qrencode
    buildsystem: cmake
    config-opts:
      - -DCMAKE_INSTALL_PREFIX=/app
      - -DBUILD_SHARED_LIBS=ON
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    sources:
      - type: git
        url: https://github.com/fukuchi/libqrencode.git
        tag: v4.1.1
        commit: 715e29fd4cd71b6e452ae0f4e36d917b43122ce8
    cleanup:
      - /include
      - /lib/pkgconfig
      - /share/man
      - '*.la'
      - '*.a'

  - name: zbar
    buildsystem: meson
    config-opts:
      - -Dlibrary_type=shared
      - -Dx11=disabled
      - -Dqt=false
      - -Dgtk=no
      - -Dpython=no
      - -Ddoc=false
      - -Ddbus=disabled
      - -Dbuild_tests=false
    sources:
      - type: git
        url: https://github.com/mchehab/zbar.git
        tag: 0.23.95
        commit: dc19fcc7da58e8cf84ba1ec417e24b04609feb23
    cleanup:
      - /include
      - /lib/pkgconfig
      - /share/man
      - '*.la'
      - '*.a'

  - name: simdutf
    buildsystem: cmake
    config-opts:
      - -DCMAKE_INSTALL_PREFIX=/app
      - -DBUILD_SHARED_LIBS=ON
    sources:
      - type: git
        url: https://github.com/simdutf/simdutf.git
        tag: v9.5.0
        commit: 9064366fa571fac03bcd28db35af597e97fba842
    cleanup:
      - /include
      - /lib/pkgconfig
      - /lib/cmake

  - name: fast_float
    buildsystem: cmake
    config-opts:
      - -DCMAKE_INSTALL_PREFIX=/app
      - -DBUILD_SHARED_LIBS=ON
    sources:
      - type: git
        url: https://github.com/fastfloat/fast_float.git
        tag: v8.4.0
        commit: 517e6b8e008341fc4ebf80cc709d8b51610a888e
    cleanup:
      - /include
      - /lib/cmake

  - name: vte
    buildsystem: meson
    config-opts:
      - -Ddocs=false
      - -Dvapi=true
      - -Dgtk4=true
      - -Dgtk3=false
      - -D_systemd=false
    sources:
      - type: git
        url: https://gitlab.gnome.org/GNOME/vte.git
        tag: 0.84.2
        commit: 6e8f399d97844a08100e815b1ca15253c3865f1e
    cleanup:
      - /etc
      - /include
      - /lib/pkgconfig
      - /share/gtk-doc
      - /share/vala
      - '*.la'
      - '*.a'

  - name: keymaker
    buildsystem: meson
    sources:
      - type: git
        url: https://github.com/tobagin/keymaker.git
        tag: v1.6.0
        commit: 81ca1ff9b4e719429edb01e3d22243121d9cd2d1